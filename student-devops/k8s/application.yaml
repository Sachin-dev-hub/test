apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: student-devops
data:
  DB_HOST: db
  DB_NAME: students
  DB_USER: studentapp
  APP_VERSION: v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: student-devops
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: student-app}
  template:
    metadata:
      labels: {app: student-app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: sachinmaskar/student-registration:v2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: application-config}
            - secretRef: {name: database-secret}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: student-app
  namespace: student-devops
spec:
  selector: {app: student-app}
  ports:
    - {port: 80, targetPort: http}
