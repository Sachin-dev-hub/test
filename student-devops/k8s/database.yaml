apiVersion: v1
kind: ConfigMap
metadata:
  name: database-schema
  namespace: student-devops
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS students (
     id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
     name VARCHAR(100) NOT NULL,
     email VARCHAR(254) NOT NULL UNIQUE,
     course VARCHAR(100) NOT NULL,
     created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: student-devops
spec:
  selector: {app: student-db}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: student-db
  namespace: student-devops
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: student-db}
  template:
    metadata:
      labels: {app: student-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: students}
            - {name: POSTGRES_USER, value: studentapp}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: database-secret, key: DB_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, studentapp, -d, students]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: schema
          configMap: {name: database-schema}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
