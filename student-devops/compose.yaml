services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: studentapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - student-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentapp -d students"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: sachinmaskar/student-registration:v2
    environment:
      DB_HOST: db
      DB_NAME: students
      DB_USER: studentapp
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  student-data:
